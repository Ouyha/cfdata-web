plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cfdata.app'
    compileSdk 36
    buildToolsVersion '36.1.0'

    defaultConfig {
        applicationId 'com.cfdata.app'
        minSdk 29
        targetSdk 36
        versionCode 10
        versionName '3.5'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            // 个人侧载先用 debug 签名，省去 keystore 配置
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation files('libs/cfdata.aar')
}
